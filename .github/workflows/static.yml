# GitHub Pages にこのリポジトリ配下の各プロジェクトをまとめてデプロイする。
#
# サイトレイアウト:
#   /sandbox/                                       -> 各サブサイトへのリンクをまとめたランディングページ (pages-index/)
#   /sandbox/rust-leptos-start-trunk-2025-08-22/    -> rust-leptos (dist-release を直置き)
#   /sandbox/book-mindmap-explorer-2026-05-03/      -> Vite + React の book mind map explorer
#   /sandbox/html-text-extractor-2026-05-04/        -> Vite + React の HTML text extractor
#   /sandbox/image-compressor-2026-07-15/           -> Vite + React の画像・PDF 圧縮ツール
#   /sandbox/spicedb-tutorial-2026-09-07/           -> SpiceDB 教科書の HTML 版 (1 ファイル完結)
#
# rust-leptos は既に dist-release/ が git にコミットされているのでビルド不要。
# spicedb-tutorial も HTML 1 枚を置くだけなのでビルド不要。
# book mind map / html-text-extractor / image-compressor は npm でビルドし、サブディレクトリに配置する。
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            book-mindmap-explorer-2026-05-03/package-lock.json
            html-text-extractor-2026-05-04/package-lock.json
            image-compressor-2026-07-15/package-lock.json

      - name: Build book-mindmap-explorer
        working-directory: book-mindmap-explorer-2026-05-03
        env:
          VITE_BASE: /sandbox/book-mindmap-explorer-2026-05-03/
        run: |
          npm ci
          npm run build

      - name: Build html-text-extractor
        working-directory: html-text-extractor-2026-05-04
        env:
          VITE_BASE: /sandbox/html-text-extractor-2026-05-04/
        run: |
          npm ci
          npm run build

      - name: Build image-compressor
        working-directory: image-compressor-2026-07-15
        env:
          VITE_BASE: /sandbox/image-compressor-2026-07-15/
        run: |
          npm ci
          npm run build

      - name: Assemble Pages site
        run: |
          set -eux
          mkdir -p _site
          # ランディングページをルートに配置
          cp -r pages-index/. _site/
          # rust-leptos をサブディレクトリに配置
          mkdir -p _site/rust-leptos-start-trunk-2025-08-22
          cp -r rust-leptos-start-trunk-2025-08-22/dist-release/. _site/rust-leptos-start-trunk-2025-08-22/
          # book mind map をサブディレクトリに配置
          mkdir -p _site/book-mindmap-explorer-2026-05-03
          cp -r book-mindmap-explorer-2026-05-03/dist/. _site/book-mindmap-explorer-2026-05-03/
          # html-text-extractor をサブディレクトリに配置
          mkdir -p _site/html-text-extractor-2026-05-04
          cp -r html-text-extractor-2026-05-04/dist/. _site/html-text-extractor-2026-05-04/
          # image-compressor をサブディレクトリに配置
          mkdir -p _site/image-compressor-2026-07-15
          cp -r image-compressor-2026-07-15/dist/. _site/image-compressor-2026-07-15/
          # spicedb-tutorial の textbook HTML 版を index.html として配置 (ビルド不要)
          mkdir -p _site/spicedb-tutorial-2026-09-07
          cp spicedb-tutorial-2026-09-07/docs/architecture/textbook/html/textbook.html \
            _site/spicedb-tutorial-2026-09-07/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
