<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SpiceDB をゼロから — 動画ステージ</title>
<style>
  /* ============ トークン ============ */
  :root {
    --bg: #1e2320;          /* 乾いたハーブ棚の暗緑 */
    --bg-lift: #272d29;
    --panel: #2a302b;
    --line: #3d453e;
    --ink: #f2ede2;         /* 生成りの紙 */
    --ink-dim: #b9b3a4;
    --paprika: #e8543f;     /* チリちゃん / 警告 */
    --turmeric: #e8a93d;    /* ボトル博士 / 経路 */
    --sage: #93b858;        /* 到達 / 成功 */
    --code-bg: #171b18;
    --sans: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    --mono: "Noto Sans Mono CJK JP", "Noto Sans Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #101311; }
  b { font-weight: 700; }

  /* 1920x1080 固定ステージ。プレビュー時だけ JS が transform で縮める */
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(1600px 1000px at 50% 42%, var(--bg-lift), var(--bg) 68%, #181c19 100%);
    color: var(--ink); font-family: var(--sans);
    transform-origin: 0 0;
  }

  /* ============ ヘッダ ============ */
  #head {
    position: absolute; top: 0; left: 0; right: 0; height: 96px;
    display: flex; align-items: center; gap: 24px; padding: 0 56px;
  }
  #head .rule { flex: 1; height: 2px; background: var(--line); border-radius: 1px; }
  #scene-title { font-size: 33px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink); }
  #scene-badge {
    font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: var(--turmeric);
    border: 2px solid var(--turmeric); border-radius: 10px; padding: 6px 16px 7px;
    background: rgba(232, 169, 61, 0.08);
  }
  #progress {
    position: absolute; bottom: 0; left: 0; height: 5px; z-index: 5;
    background: linear-gradient(90deg, var(--turmeric), var(--paprika));
    width: 0; opacity: 0.85;
  }

  /* ============ スライド面 ============ */
  #scenes { position: absolute; top: 96px; left: 0; right: 0; bottom: 352px; }
  .scene {
    position: absolute; inset: 0; padding: 14px 120px 0; opacity: 0;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .scene .inner { width: 100%; max-width: 1680px; margin: 0 auto; }

  /* step 出現 (opacity / transform は page.js が t から直接書く) */
  [data-step] { opacity: 0; }

  /* ---- 汎用部品 ---- */
  .lede { font-size: 52px; font-weight: 900; letter-spacing: 0.02em; line-height: 1.3; }
  .lede .accent { color: var(--turmeric); }
  .sub { font-size: 30px; color: var(--ink-dim); margin-top: 14px; line-height: 1.5; }

  .cardrow { display: flex; gap: 28px; margin-top: 30px; }
  .card {
    flex: 1; background: var(--panel); border: 2px solid var(--line);
    border-radius: 18px; padding: 26px 30px;
  }
  .card h3 { font-size: 30px; font-weight: 900; margin-bottom: 10px; letter-spacing: 0.03em; }
  .card p { font-size: 26px; line-height: 1.55; color: var(--ink-dim); }
  .card p strong { color: var(--ink); font-weight: 700; }
  .card.gold { border-color: var(--turmeric); }
  .card.gold h3 { color: var(--turmeric); }
  .card.red { border-color: var(--paprika); }
  .card.red h3 { color: var(--paprika); }
  .card.green { border-color: var(--sage); }
  .card.green h3 { color: var(--sage); }

  .klist { list-style: none; margin-top: 26px; }
  .klist li {
    font-size: 33px; line-height: 1.45; padding: 14px 0 14px 30px; position: relative;
  }
  .klist li::before {
    content: ""; position: absolute; left: 0; top: 30px; width: 14px; height: 14px;
    border-radius: 4px; background: var(--turmeric); transform: rotate(45deg);
  }
  .klist li b.term { color: var(--turmeric); font-weight: 900; }
  .klist li .dim { color: var(--ink-dim); }

  pre.code {
    font-family: var(--mono); font-size: 27px; line-height: 1.6;
    background: var(--code-bg); border: 2px solid var(--line); border-radius: 14px;
    padding: 24px 32px; margin-top: 26px; white-space: pre; overflow: hidden;
  }
  pre.code .c-kw { color: #d9a0e8; }
  pre.code .c-str { color: var(--sage); }
  pre.code .c-cm { color: #7b8578; }
  pre.code .c-fn { color: #7fb8e8; }
  pre.code .c-warn { color: var(--paprika); font-weight: 700; }
  pre.code .c-gold { color: var(--turmeric); }

  table.tbl { border-collapse: collapse; width: 100%; margin-top: 26px; }
  table.tbl th, table.tbl td {
    text-align: left; font-size: 27px; padding: 13px 22px; line-height: 1.4;
  }
  table.tbl th { color: var(--ink-dim); font-weight: 700; border-bottom: 2px solid var(--line); font-size: 24px; }
  table.tbl td { border-bottom: 1px solid var(--line); }
  table.tbl td.k { font-weight: 900; color: var(--turmeric); white-space: nowrap; }
  table.tbl tr.hot td { background: rgba(232, 169, 61, 0.10); }
  table.tbl td .mono, .mono { font-family: var(--mono); }

  .note {
    margin-top: 26px; border-left: 8px solid var(--paprika); background: rgba(232, 84, 63, 0.10);
    border-radius: 0 14px 14px 0; padding: 20px 28px; font-size: 29px; line-height: 1.5;
  }
  .note.ok { border-left-color: var(--sage); background: rgba(147, 184, 88, 0.10); }
  .note b { color: var(--paprika); }
  .note.ok b { color: var(--sage); }

  .stamp {
    display: inline-block; font-size: 40px; font-weight: 900; letter-spacing: 0.1em;
    color: var(--sage); border: 4px solid var(--sage); border-radius: 12px;
    padding: 4px 20px; transform: rotate(-6deg); background: rgba(147,184,88,0.12);
  }
  .stamp.bad { color: var(--paprika); border-color: var(--paprika); background: rgba(232,84,63,0.12); }

  /* ============ 下帯: キャラ + 字幕 ============ */
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 352px; }
  .chara { position: absolute; bottom: 40px; width: 280px; height: 308px; }
  .chara svg { width: 100%; height: 100%; }
  #chara-metan { left: 30px; }
  #chara-zunda { right: 30px; }
  .nameplate {
    position: absolute; bottom: 10px; padding: 4px 22px 6px; border-radius: 12px;
    font-size: 23px; font-weight: 900; letter-spacing: 0.06em;
    background: #20241f; border: 2.5px solid var(--line); color: var(--ink-dim);
  }
  #plate-metan { left: 86px; }
  #plate-zunda { right: 88px; }
  .nameplate.on { color: #1c1c17; }
  #plate-metan.on { background: var(--paprika); border-color: var(--paprika); }
  #plate-zunda.on { background: var(--turmeric); border-color: var(--turmeric); }

  #caption-box {
    position: absolute; left: 340px; right: 340px; bottom: 56px; min-height: 140px;
    background: rgba(13, 16, 14, 0.78); border: 2px solid var(--line); border-radius: 20px;
    padding: 24px 40px; display: flex; align-items: center; justify-content: center;
  }
  #caption-box.sp-zunda { border-color: rgba(232, 169, 61, 0.75); }
  #caption-box.sp-metan { border-color: rgba(232, 84, 63, 0.75); }
  #caption { font-size: 35px; line-height: 1.5; font-weight: 700; text-align: center; }
  #caption .kw { color: var(--turmeric); }

  /* ============ プレビュー操作 (render 時は非表示) ============ */
  #ctrl {
    position: fixed; left: 12px; bottom: 12px; z-index: 10; display: flex; gap: 10px;
    align-items: center; background: #000c; color: #eee; padding: 10px 14px;
    border-radius: 10px; font-family: var(--sans); font-size: 14px;
  }
  #ctrl button { font-size: 16px; padding: 4px 14px; }
  #ctrl input[type="range"] { width: 420px; }
  body.render #ctrl { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="head">
      <div id="scene-title"></div>
      <div class="rule"></div>
      <div id="scene-badge"></div>
    </div>
    <div id="scenes"></div>
    <div id="bottom">
      <div class="chara" id="chara-metan"></div>
      <div class="chara" id="chara-zunda"></div>
      <div id="caption-box"><div id="caption"></div></div>
      <div class="nameplate" id="plate-metan">チリちゃん</div>
      <div class="nameplate" id="plate-zunda">ボトル博士</div>
    </div>
    <div id="progress"></div>
  </div>

  <div id="ctrl">
    <button id="btn-play">▶ 再生</button>
    <input id="seekbar" type="range" min="0" max="1000" value="0">
    <span id="clock">0.0 / 0.0</span>
  </div>

  <audio id="voice" src="../build/full.wav" preload="auto"></audio>
  <script src="../build/timeline.js"></script>
  <script src="characters.js"></script>
  <script src="slides.js"></script>
  <script src="page.js"></script>
</body>
</html>
